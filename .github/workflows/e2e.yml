# Maestro end-to-end journeys (.maestro/journeys/) against the devDebug build on an emulator.
# Runs after merges into develop, on release PRs into main, and on demand. Not on PRs into develop.
name: E2E

on:
  push:
    branches: [develop, feature/BET-53-maestro-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAESTRO_VERSION: 2.11.0

jobs:
  e2e:
    name: Maestro E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs (11 for the toolchain, 21 for the Gradle daemon and Maestro)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            11
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Build devDebug
        run: >
          ./gradlew --stacktrace
          assembleDevDebug
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_21_X64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro journeys
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            # The journeys' number regexes expect en-US formatting ("1,007"), the image's default.
            # (-change-locale restarts the framework while the action is still configuring it.)
            adb shell getprop | grep -E 'locale\]: \[en-US\]'
            # A freshly booted CI emulator is slow, and an "isn't responding" dialog for the launcher
            # would cover the app. Suppress ANR/crash dialogs and close any already showing.
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb install app/build/outputs/apk/dev/debug/app-dev-debug.apk
            maestro test .maestro/journeys/ --test-output-dir build/maestro --debug-output build/maestro

      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-output
          path: build/maestro/
          if-no-files-found: ignore
          retention-days: 14
